<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La mia auto — Europa Auto</title>
<meta name="description" content="La tua auto Europa Auto: scadenze, finanziamento e richieste di assistenza in un posto solo.">
<meta name="theme-color" content="#0B1F3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<style>
:root{
  --navy:#0B1F3A; --navy2:#12305C; --blu:#1F5FD1; --blu-soft:#E7EEFB; --sky:#F2F5FA;
  --ink:#14213A; --ink2:#5B6B86; --line:#E3E8F0; --white:#fff;
  --ok:#159A62; --ok-soft:#E3F6ED; --att:#D98B0C; --att-soft:#FFF3DC; --ko:#D9412F; --ko-soft:#FDE8E5;
  --r-lg:22px; --r:16px; --r-sm:12px;
  --shadow:0 10px 30px -18px rgba(11,31,58,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
html,body{margin:0;background:var(--sky);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
body{min-height:100dvh}
a{color:var(--blu);text-decoration:none}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid #9ec1ff;outline-offset:2px;border-radius:8px}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---- cornice: su telefono piena, su schermo grande una colonna centrata ---- */
.frame{max-width:520px;margin:0 auto;min-height:100dvh;position:relative;background:var(--sky)}
@media(min-width:720px){
  body{background:radial-gradient(1200px 600px at 50% -200px,#dbe6fa,#f2f5fa 60%)}
  .frame{box-shadow:0 30px 80px -40px rgba(11,31,58,.45);margin:24px auto;min-height:calc(100dvh - 48px);border-radius:32px;overflow:hidden}
}

/* ---- testata ---- */
.hdr{padding:calc(16px + env(safe-area-inset-top)) 22px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.02em}
.brand .t{font-weight:800;font-size:15px;line-height:1.1}
.brand .t small{display:block;font-weight:600;font-size:12px;color:var(--ink2)}
.hdr .user{border:none;background:var(--white);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;box-shadow:0 1px 0 var(--line)}

/* ---- contenuto e transizioni ---- */
.view{padding:6px 18px calc(110px + env(safe-area-inset-bottom));animation:in .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:10px 0 6px;font-weight:800}
h2{font-size:17px;margin:0 0 10px;font-weight:800;letter-spacing:-.01em}
p{margin:0}
.lead{color:var(--ink2);font-size:15px;line-height:1.5}
.sect{margin-top:22px}
.sect>h2{padding:0 2px}
.panel{background:var(--white);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}

/* ---- la scheda dell'auto (l'elemento forte) ---- */
.carcard{background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 70%,#1a4291 100%);color:#fff;border-radius:var(--r-lg);padding:22px 20px 20px;position:relative;overflow:hidden;box-shadow:0 24px 50px -28px rgba(11,31,58,.7)}
.carcard::after{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.14),rgba(255,255,255,0))}
.carcard .name{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.05}
.carcard .trim{color:rgba(255,255,255,.72);font-size:14px;margin-top:4px;font-weight:600}
.carcard img{width:100%;height:190px;object-fit:cover;border-radius:14px;margin-top:16px;display:block;background:rgba(255,255,255,.08)}
.carcard .noimg{height:120px;border-radius:14px;margin-top:16px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:rgba(255,255,255,.55);font-size:14px;font-weight:600}
.targa{display:inline-flex;align-items:stretch;border-radius:7px;overflow:hidden;background:#fff;color:#111;font-weight:800;font-size:18px;letter-spacing:.14em;margin-top:16px;box-shadow:0 6px 16px -8px rgba(0,0,0,.5)}
.targa .eu{background:#1b3fa0;color:#ffd84d;width:22px;display:grid;place-items:center;font-size:8px;letter-spacing:0;font-weight:800;padding-top:2px}
.targa span{padding:6px 12px 5px;font-family:"Manrope",monospace}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:18px}
.fact .k{font-size:12px;color:rgba(255,255,255,.62);font-weight:600}
.fact .v{font-size:16px;font-weight:800;margin-top:2px}

/* ---- avvisi ---- */
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--white);box-shadow:var(--shadow);margin-top:10px;border-left:4px solid var(--att)}
.alert.ko{border-left-color:var(--ko)}
.alert .ic{width:36px;height:36px;border-radius:10px;background:var(--att-soft);display:grid;place-items:center;flex:0 0 auto;color:var(--att)}
.alert.ko .ic{background:var(--ko-soft);color:var(--ko)}
.alert b{display:block;font-size:15px}.alert span{font-size:13px;color:var(--ink2)}
.alert .d{margin-left:auto;font-weight:800;font-size:14px;white-space:nowrap}

/* ---- linea del tempo scadenze ---- */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.ev{position:relative;padding:12px 0 14px;display:flex;gap:12px;align-items:flex-start}
.ev+.ev{border-top:1px solid var(--line)}
.ev::before{content:"";position:absolute;left:-23px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--dot,#B9C4D6);box-shadow:0 0 0 4px var(--sky)}
.ev .t{flex:1;min-width:0}
.ev .t b{display:block;font-size:16px}
.ev .t span{display:block;font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.4}
.ev .when{text-align:right;flex:0 0 auto}
.ev .when b{display:block;font-size:15px}
.ev .when span{display:block;font-size:12px;color:var(--ink2);margin-top:2px}
.ev .edit{margin-top:6px;border:1px solid var(--line);background:var(--white);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--blu);cursor:pointer}

/* ---- richiedi: piastrelle ---- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:1.5px solid transparent;background:var(--white);border-radius:var(--r);padding:16px 14px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
.tile:active{transform:scale(.98)}
.tile.on{border-color:var(--blu);background:var(--blu-soft)}
.tile .ic{width:38px;height:38px;border-radius:11px;background:var(--blu-soft);color:var(--blu);display:grid;place-items:center}
.tile.on .ic{background:var(--blu);color:#fff}
.tile b{font-size:15px;line-height:1.2}.tile span{font-size:12.5px;color:var(--ink2);line-height:1.35}

/* ---- form ---- */
label{display:block;font-size:13.5px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
input,select,textarea{width:100%;padding:14px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);font-family:inherit;font-size:16px;background:var(--white);color:var(--ink);transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blu);box-shadow:0 0 0 4px rgba(31,95,209,.12)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:14px;border:none;background:var(--blu);color:#fff;font-weight:800;font-size:16px;cursor:pointer;transition:transform .12s ease,filter .15s}
.btn:active{transform:scale(.985)}
.btn:hover{filter:brightness(1.05)}
.btn.sec{background:var(--white);color:var(--navy);border:1.5px solid var(--line)}
.btn.ghost{background:transparent;color:var(--ink2);font-weight:700;font-size:14px;padding:10px}
.btn:disabled{opacity:.6;cursor:default}
.row{display:flex;gap:10px}
.note{font-size:14px;line-height:1.5;padding:12px 14px;border-radius:var(--r-sm);margin-top:12px}
.note.err{background:var(--ko-soft);color:#8f2419}.note.ok{background:var(--ok-soft);color:#0f5f3d}
.hint{background:var(--white);border-radius:var(--r);padding:12px 14px;font-size:14px;color:var(--ink2);line-height:1.5;display:flex;gap:10px;align-items:center;margin:10px 0 0;box-shadow:var(--shadow)}
.hint a{font-weight:800}

/* ---- richieste ---- */
.req{background:var(--white);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.req+.req{margin-top:12px}
.req .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.req .top b{font-size:16px}
.pill{border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.p-ric{background:var(--att-soft);color:#8a5a00}.p-lav{background:var(--blu-soft);color:var(--blu)}.p-chi{background:var(--ok-soft);color:#0f5f3d}
.req .meta{font-size:13px;color:var(--ink2);margin-top:4px}
.req .txt{font-size:15px;line-height:1.5;margin-top:10px;white-space:pre-wrap}
.req .ans{margin-top:12px;background:var(--sky);border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.5}
.req .ans b{display:block;color:var(--navy);margin-bottom:2px}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.fotos img{width:76px;height:76px;object-fit:cover;border-radius:10px}

/* ---- nav a pillola ---- */
.nav{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:9}
.nav .pill{pointer-events:auto;display:flex;gap:2px;background:rgba(11,31,58,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:6px;box-shadow:0 18px 40px -16px rgba(11,31,58,.7)}
.nav button{border:none;background:none;color:rgba(255,255,255,.7);border-radius:999px;padding:9px 13px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px;cursor:pointer;transition:background .2s,color .2s}
.nav button svg{width:20px;height:20px}
.nav button span{display:none}
.nav button.on{background:#fff;color:var(--navy)}
.nav button.on span{display:inline}

/* ---- varie ---- */
.hidden{display:none !important}
.center{text-align:center}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,#e6ebf3 25%,#f3f6fb 50%,#e6ebf3 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.spin{display:inline-block;width:20px;height:20px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
.spin.dark{border-color:#cfd8e6;border-top-color:var(--blu)}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:all .3s cubic-bezier(.2,.8,.2,1);z-index:20;box-shadow:0 14px 30px -14px rgba(0,0,0,.6);max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.login{padding:20px 22px 40px}
.login .hero{padding:26px 0 10px}
.login .hero h1{font-size:34px;line-height:1.05;letter-spacing:-.03em}
.login .hero p{margin-top:10px}
.contact{margin-top:26px;font-size:13.5px;color:var(--ink2);line-height:1.6;text-align:center}
</style>
</head>
<body>

  <header class="hdr">

/* ====================== UTILITA' ====================== */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function dIT(d){ if(!d) return '—'; var x=(d instanceof Date)?d:new Date(d); if(isNaN(x)) return '—'; return x.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function dLunga(d){ if(!d) return ''; return d.toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'}); }
function dISO(x){ var d=(x instanceof Date)?x:new Date(x); if(isNaN(d)) return ''; return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseD(v){ if(!v) return null; if(typeof v==='number') return new Date(v); var s=String(v); if(/^\d{13}$/.test(s)) return new Date(+s); var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]); var m2=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(m2){ var y=+m2[3]; if(y<100) y+=2000; return new Date(y,+m2[2]-1,+m2[1]); } var t=Date.parse(s); return isNaN(t)?null:new Date(t); }
function addM(d,m){ var x=new Date(d.getTime()); x.setMonth(x.getMonth()+m); return x; }
function giorni(d){ if(!d) return null; var o=new Date(); o.setHours(0,0,0,0); return Math.round((d.getTime()-o.getTime())/86400000); }
function euro(n){ var v=parseFloat(String(n==null?'':n).replace(',','.')); return isNaN(v)?'—':v.toLocaleString('it-IT',{style:'currency',currency:'EUR'}); }
function cap(s){ s=String(s||''); return s? s.charAt(0).toUpperCase()+s.slice(1).toLowerCase():''; }
function nomeAuto(a){ return ((a.marca||'')+' '+(a.modello||'')).replace(/\s+/g,' ').trim(); }
function dot(gg){ if(gg===null) return '#B9C4D6'; if(gg<0) return 'var(--ko)'; if(gg<=45) return 'var(--att)'; return 'var(--ok)'; }
function quando(gg){ if(gg===null) return 'data da inserire'; if(gg<0) return 'scaduta da '+Math.abs(gg)+(Math.abs(gg)===1?' giorno':' giorni'); if(gg===0) return 'oggi'; if(gg===1) return 'domani'; if(gg<=60) return 'tra '+gg+' giorni'; var m=Math.round(gg/30); return 'tra '+m+(m===1?' mese':' mesi'); }
function toast(t){ var e=$('toast'); e.textContent=t; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(function(){ e.classList.remove('show'); },2600); }
function targaHTML(t){ return t?('<div class="targa"><div class="eu">I</div><span>'+esc(t)+'</span></div>'):''; }
function ic(k){ return IC[k]||''; }

/* ====================== ACCESSO ====================== */
function vistaLogin(msg, modo){
  $('nav').classList.add('hidden'); $('btn-esci').classList.add('hidden');
  modo=modo||'login';
  var titolo = modo==='login' ? 'La tua auto,<br>sempre con te.' : (modo==='reg' ? 'Crea il tuo accesso' : 'Nuova password');
  var sotto = modo==='login'
    ? 'Scadenze, finanziamento e un canale diretto con noi per assistenza, tagliandi e carrozzeria.'
    : (modo==='reg' ? 'Usa la stessa email che ci hai lasciato all’acquisto: è così che riconosciamo la tua auto.'
                    : 'Ti mandiamo un link via email per sceglierne una nuova.');
  $('app').innerHTML='<div class="view login">'
   +'<div class="hero"><h1>'+titolo+'</h1><p class="lead">'+sotto+'</p></div>'
   +'<div class="panel" style="margin-top:14px;">'
   +'<label for="l-email">Email</label><input id="l-email" type="email" autocomplete="email" inputmode="email" placeholder="nome@esempio.it">'
   +(modo!=='reset'?('<label for="l-pass">Password</label><input id="l-pass" type="password" autocomplete="'+(modo==='reg'?'new-password':'current-password')+'" placeholder="'+(modo==='reg'?'almeno 8 caratteri':'')+'" onkeydown="if(event.key===\'Enter\')'+(modo==='login'?'login()':'registra()')+'">'):'')
   +(modo==='reg'?'<label for="l-nome">Nome e cognome</label><input id="l-nome" type="text" autocomplete="name"><label for="l-tel">Telefono</label><input id="l-tel" type="tel" autocomplete="tel" placeholder="per richiamarti">':'')
   +'<div id="l-msg"></div>'
   +'<div style="margin-top:18px;"><button class="btn" id="l-go" onclick="'+(modo==='login'?'login()':(modo==='reg'?'registra()':'resetPass()'))+'">'+(modo==='login'?'Entra':(modo==='reg'?'Crea accesso':'Invia il link'))+'</button></div>'
   +'<div class="row" style="justify-content:space-between;margin-top:6px;">'
   +(modo==='login'
      ? '<button class="btn ghost" style="width:auto" onclick="vistaLogin(\'\',\'reg\')">Prima volta qui? Crea accesso</button><button class="btn ghost" style="width:auto" onclick="vistaLogin(\'\',\'reset\')">Password dimenticata</button>'
      : '<button class="btn ghost" style="width:auto" onclick="vistaLogin()">Torna all’accesso</button>')
   +'</div></div>'
   +'<div class="contact">'+esc(AZIENDA.nome)+' — '+esc(AZIENDA.indirizzo)+'<br><a href="'+AZIENDA.telHref+'">'+esc(AZIENDA.tel)+'</a> &nbsp;|&nbsp; <a href="https://wa.me/'+AZIENDA.wa+'">WhatsApp</a></div>'
   +'</div>';
  if(msg) lmsg(msg, !/errore|non |sbagliat/i.test(msg));
}
function lmsg(t, ok){ var m=$('l-msg'); if(m) m.innerHTML=t?('<div class="note '+(ok?'ok':'err')+'">'+esc(t)+'</div>'):''; }
function attesa(on){ var b=$('l-go'); if(!b) return; if(on){ b._txt=b.textContent; b.disabled=true; b.innerHTML='<span class="spin"></span>'; } else { b.disabled=false; b.textContent=b._txt||'Entra'; } }
async function login(){
  var e=($('l-email').value||'').trim().toLowerCase(), p=$('l-pass').value||'';
  if(!e||!p){ lmsg('Inserisci email e password.'); return; }
  attesa(true);
  var r=await sb.auth.signInWithPassword({ email:e, password:p });
  if(r.error){ attesa(false); lmsg(r.error.message==='Invalid login credentials'?'Email o password non corrette. Se è la prima volta, crea l’accesso.':('Errore: '+r.error.message)); return; }
  await avvia();
}
async function registra(){
  var e=($('l-email').value||'').trim().toLowerCase(), p=$('l-pass').value||'';
  var nome=($('l-nome').value||'').trim(), tel=($('l-tel').value||'').trim();
  if(!/.+@.+\..+/.test(e)){ lmsg('Controlla l’email.'); return; }
  if(p.length<8){ lmsg('La password deve avere almeno 8 caratteri.'); return; }
  attesa(true);
  var r=await sb.auth.signUp({ email:e, password:p, options:{ data:{ nome:nome, telefono:tel } } });
  if(r.error){ attesa(false); lmsg('Errore: '+r.error.message); return; }
  if(r.data && r.data.session){ await avvia(); return; }
  attesa(false);
  vistaLogin('Ti abbiamo scritto: apri il link nella mail per confermare, poi entra con email e password.');
}
async function resetPass(){
  var e=($('l-email').value||'').trim().toLowerCase();
  if(!/.+@.+\..+/.test(e)){ lmsg('Controlla l’email.'); return; }
  attesa(true);
  var r=await sb.auth.resetPasswordForEmail(e, { redirectTo: location.origin+location.pathname });
  attesa(false);
  if(r.error){ lmsg('Errore: '+r.error.message); return; }
  vistaLogin('Se l’email è registrata, il link per la nuova password sta arrivando.');
}
async function esci(){ await sb.auth.signOut(); S={ user:null, auto:[], sel:0, scad:{}, richieste:[], vista:'auto', tipo:'', foto:[], errore:'' }; vistaLogin(); }
async function nuovaPassword(){
  var p=prompt('Scegli la nuova password (almeno 8 caratteri):'); if(!p) return;
  if(p.length<8){ alert('Troppo corta.'); return; }
  var r=await sb.auth.updateUser({ password:p });
  toast(r.error?('Errore: '+r.error.message):'Password aggiornata');
}

/* ====================== DATI ====================== */
async function carica(){
  var r=await sb.rpc('mie_pratiche');
  if(r.error){ console.warn(r.error); S.auto=[]; S.errore=r.error.message; }
  else { S.auto=(r.data||[]).slice(); S.errore=''; }
  S.auto.sort(function(a,b){ return (+b.consegnatoTs||+b.contrattoTs||0)-(+a.consegnatoTs||+a.contrattoTs||0); });
  var sc=await sb.from('scadenze_cliente').select('*');
  S.scad={}; (sc.data||[]).forEach(function(x){ S.scad[x.cv_id+'|'+x.tipo]=x; });
  var rq=await sb.from('richieste_cliente').select('*').order('created_at',{ascending:false});
  S.richieste=rq.data||[];
}
function autoSel(){ return S.auto[S.sel]||null; }
function scadenze(a){
  var out=[], imm=parseD(a.dataImm), cons=parseD(a.consegnatoTs)||parseD(a.contrattoTs);
  var mia=function(t){ var x=S.scad[a.id+'|'+t]; return x&&x.data?parseD(x.data):null; };
  var rev=mia('revisione');
  if(!rev && imm){ rev=addM(imm,48); var oggi=new Date(); while(rev<oggi) rev=addM(rev,24); }
  out.push({ tipo:'revisione', nome:'Revisione', fonte:(mia('revisione')?'Data inserita da te':'Calcolata dalla prima immatricolazione: a 4 anni, poi ogni 2'), data:rev, mod:true });
  var gm=parseInt(a.garanziaMesi,10);
  if(cons && gm) out.push({ tipo:'garanzia', nome:'Garanzia', fonte:gm+' mesi dalla consegna', data:addM(cons,gm) });
  var am=parseInt(a.assicMesi,10);
  if((a.assicOn===true||a.assicOn==='true') && cons && am) out.push({ tipo:'polizza', nome:'Polizza furto e incendio', fonte:(a.polizzaTipo&&a.polizzaTipo!=='nessuna'?cap(String(a.polizzaTipo).replace(/_/g,' '))+' · ':'')+am+' mesi dalla consegna', data:addM(cons,am) });
  var fd=a.finDelibera, fp=a.finPagamento;
  var durata=parseInt((fd&&fd.durata)||(fp&&fp.rate)||'',10);
  var rata=(fd&&fd.rata)||(fp&&fp.importoRata)||'';
  if(cons && durata) out.push({ tipo:'finanziamento', nome:'Ultima rata', fonte:((fd&&fd.finanziaria)?fd.finanziaria+' · ':'')+durata+' rate'+(rata?(' da '+euro(rata)):''), data:addM(cons,durata) });
  out.push({ tipo:'rc', nome:'Assicurazione RC auto', fonte:'La scadenza della tua polizza RC', data:mia('rc'), mod:true });
  out.push({ tipo:'bollo', nome:'Bollo', fonte:'La scadenza del bollo', data:mia('bollo'), mod:true });
  var tg=mia('tagliando'); if(!tg && cons) tg=addM(cons,12);
  out.push({ tipo:'tagliando', nome:'Prossimo tagliando', fonte:(mia('tagliando')?'Data inserita da te':'Consigliato a 12 mesi dalla consegna'), data:tg, mod:true });
  out.forEach(function(s){ s.gg=giorni(s.data); });
  out.sort(function(x,y){ var a=(x.gg===null)?99999:x.gg, b=(y.gg===null)?99999:y.gg; return a-b; });
  return out;
}
async function salvaScadenza(tipo){
  var a=autoSel(); if(!a) return;
  var attuale=S.scad[a.id+'|'+tipo];
  var v=prompt('Data di scadenza (gg/mm/aaaa). Lascia vuoto per toglierla.', attuale&&attuale.data?dIT(attuale.data):'');
  if(v===null) return;
  v=v.trim();
  if(!v){ if(attuale){ await sb.from('scadenze_cliente').delete().eq('id',attuale.id); } }
  else {
    var d=parseD(v); if(!d){ toast('Data non valida: usa gg/mm/aaaa'); return; }
    var r=await sb.from('scadenze_cliente').upsert({ user_id:S.user.id, cv_id:a.id, tipo:tipo, data:dISO(d), updated_at:new Date().toISOString() }, { onConflict:'user_id,cv_id,tipo' });
    if(r.error){ toast('Non salvata: '+r.error.message); return; }
  }
  await carica(); render(); toast('Scadenza aggiornata');
}

/* ====================== VISTE ====================== */
function vai(v){ S.vista=v; render(); window.scrollTo({top:0,behavior:'instant'}); }
function render(){
  $('nav').classList.remove('hidden'); $('btn-esci').classList.remove('hidden');
  document.querySelectorAll('.nav button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-v')===S.vista); });
  var h='';
  if(S.errore) h+='<div class="note err">Non riesco a leggere i dati: '+esc(S.errore)+'</div>';
  if(!S.auto.length && S.vista!=='richiedi' && S.vista!=='richieste'){
    h+='<h1>Nessuna auto collegata</h1><p class="lead">Non troviamo acquisti registrati con <b>'+esc(S.user.email)+'</b>. Se hai comprato con un’altra email, scrivici: colleghiamo noi la tua auto a questo accesso.</p>'
      +'<div style="margin-top:18px;"><a class="btn" href="https://wa.me/'+AZIENDA.wa+'?text='+encodeURIComponent('Buongiorno, vorrei collegare la mia auto all’app. La mia email è '+S.user.email)+'">Scrivici su WhatsApp</a></div>'
      +'<div style="margin-top:10px;"><button class="btn sec" onclick="vai(\'richiedi\')">Oppure manda una richiesta</button></div>';
    $('app').innerHTML='<div class="view">'+h+installHint()+'</div>'; return;
  }
  if(S.vista==='auto') h+=vAuto();
  else if(S.vista==='scadenze') h+=vScadenze();
  else if(S.vista==='richiedi') h+=vRichiedi();
  else h+=vRichieste();
  $('app').innerHTML='<div class="view">'+installHint()+h+'</div>';
}

function fotoScelte(inp){
  var files=Array.prototype.slice.call(inp.files||[]).slice(0,3); S.foto=[];
  files.forEach(function(f){
    var img=new Image(), url=URL.createObjectURL(f);
    img.onload=function(){
      var max=1280, w=img.width, hh=img.height, k=Math.min(1,max/Math.max(w,hh));
      var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(hh*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      S.foto.push(c.toDataURL('image/jpeg',0.72)); URL.revokeObjectURL(url);
      var box=$('r-fotos'); if(box) box.innerHTML=S.foto.map(function(x){ return '<img src="'+x+'">'; }).join('');
    };
    img.src=url;
  });
}
async function invia(){

  b.disabled=true; b.innerHTML='<span class="spin"></span>';
  var rec={ user_id:S.user.id, email:S.user.email, nome:(S.user.user_metadata&&S.user.user_metadata.nome)||'', telefono:tel,
    cv_id:a?a.id:null, targa:a?a.targa:null, auto:a?nomeAuto(a):null, tipo:S.tipo, testo:testo, data_pref:data, foto:S.foto };

  S.foto=[]; S.tipo='';

      +'<div class="meta">'+dIT(r.created_at)+(r.auto?(' — '+esc(r.auto)):'')+(r.data_pref?(' — preferito il '+dIT(r.data_pref)):'')+'</div>'
      +(r.testo?('<div class="txt">'+esc(r.testo)+'</div>'):'')
      +((r.foto&&r.foto.length)?('<div class="fotos">'+r.foto.map(function(f){ return '<img src="'+f+'">'; }).join('')+'</div>'):'')
      +(r.risposta?('<div class="ans"><b>Europa Auto'+(r.gestita_da?(' — '+esc(r.gestita_da)):'')+'</b>'+esc(r.risposta)+(r.risposta_ts?('<div class="meta">'+dIT(r.risposta_ts)+'</div>'):'')+'</div>'):'')
      +(r.stato==='ricevuta'?('<div style="margin-top:8px;"><button class="btn ghost" style="width:auto;padding:6px 0;" onclick="annulla(\''+r.id+'\')">Annulla richiesta</button></div>'):'')
      +'</div>';
  }).join('')+'</div>';
  return h;
}
async function annulla(id){ if(!confirm('Annullare questa richiesta?')) return; await sb.from('richieste_cliente').delete().eq('id',id); await carica(); render(); toast('Richiesta annullata'); }

/* ====================== PWA ====================== */
var _installEv=null;
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); _installEv=e; try{ if(S.user) render(); }catch(_){ } });
function installHint(){
  if(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) return '';
  if(_installEv) return '<div class="hint" style="margin-bottom:12px;">Aggiungi l’app alla schermata Home: si apre al volo, senza browser. <a href="#" onclick="_installEv.prompt();return false;">Installa</a></div>';
  if(/iphone|ipad/i.test(navigator.userAgent)) return '<div class="hint" style="margin-bottom:12px;">Su iPhone: Condividi, poi <b>Aggiungi alla schermata Home</b>.</div>';
  return '';
}
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }

/* ====================== AVVIO ====================== */
async function avvia(){
  var s=await sb.auth.getSession();
  S.user=(s.data&&s.data.session)?s.data.session.user:null;
  if(!S.user){ vistaLogin(); return; }
  await carica();
  render();
}
sb.auth.onAuthStateChange(function(ev){ if(ev==='PASSWORD_RECOVERY'){ nuovaPassword(); } });
avvia();
</script>
