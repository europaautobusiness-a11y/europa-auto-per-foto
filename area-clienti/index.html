<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#1a4fa0">

<style>
:root{--blu:#1a4fa0;--blu2:#143d7c;--ink:#0f172a;--grigio:#64748b;--bordo:#e2e8f0;--sfondo:#f3f5f9;--ok:#16a34a;--att:#d97706;--ko:#dc2626;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sfondo);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
a{color:var(--blu)}
button{font-family:inherit}
.top{background:linear-gradient(135deg,var(--blu),var(--blu2));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top .logo{font-weight:900;letter-spacing:.02em;font-size:17px}
.top .logo small{display:block;font-weight:600;font-size:11.5px;opacity:.85;letter-spacing:.06em;text-transform:uppercase}
.top button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--bordo);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
h1{font-size:22px;margin:0 0 6px}h2{font-size:15px;margin:0 0 10px;color:var(--ink)}
.muted{color:var(--grigio);font-size:13px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;border:none;background:var(--blu);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
.btn.sec{background:#fff;color:var(--blu);border:1.5px solid var(--blu)}
.btn.ghost{background:transparent;color:var(--grigio);border:none;font-weight:700;font-size:13px}
.btn:disabled{opacity:.55}
input,select,textarea{width:100%;padding:13px 12px;border:1px solid #cbd5e1;border-radius:11px;font-family:inherit;font-size:16px;background:#fff;color:var(--ink)}
textarea{min-height:96px;resize:vertical}
label{display:block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--grigio);margin:12px 0 5px}
.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
.ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
.hero{display:flex;gap:14px;align-items:center}
.hero img,.hero .ph{width:112px;height:84px;border-radius:12px;object-fit:cover;background:#e2e8f0;flex:0 0 auto}
.hero .ph{display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:28px}
.targa{display:inline-block;border:2px solid var(--ink);border-radius:5px;padding:1px 8px;font-weight:900;letter-spacing:.08em;font-size:13px;background:#fff;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{background:#f8fafc;border-radius:10px;padding:9px 11px}
.kv .k{font-size:10.5px;color:var(--grigio);text-transform:uppercase;letter-spacing:.05em;font-weight:800}
.kv .v{font-size:14px;font-weight:700;margin-top:2px}
.sc{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f1f5f9}
.sc:last-child{border-bottom:none}
.sc .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.sc .t{flex:1;min-width:0}
.sc .t b{display:block;font-size:14px}
.sc .t span{font-size:12.5px;color:var(--grigio)}
.sc .d{text-align:right;font-weight:800;font-size:13.5px;white-space:nowrap}
.sc .d small{display:block;font-weight:600;color:var(--grigio);font-size:11px}
.sc button{border:1px solid var(--bordo);background:#fff;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700;color:var(--blu);cursor:pointer}
.tipi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tipo{border:1.5px solid var(--bordo);background:#fff;border-radius:14px;padding:14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.tipo .i{font-size:24px}.tipo b{font-size:14px}.tipo span{font-size:12px;color:var(--grigio)}
.tipo.on{border-color:var(--blu);background:#eff6ff}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bordo);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav button{flex:1;border:none;background:none;padding:10px 4px 9px;font-size:11px;font-weight:700;color:var(--grigio);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nav button .i{font-size:20px}.nav button.on{color:var(--blu)}
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800}
.p-ric{background:#fff7ed;color:#9a3412}.p-lav{background:#eff6ff;color:#1e40af}.p-chi{background:#f0fdf4;color:#166534}
.req{padding:12px 0;border-bottom:1px solid #f1f5f9}.req:last-child{border-bottom:none}
.req .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.req .h b{font-size:14px}.req .m{font-size:13px;color:#334155;margin-top:5px;white-space:pre-wrap}
.req .r{margin-top:8px;background:#f0fdf4;border-left:3px solid var(--ok);padding:8px 10px;border-radius:0 8px 8px 0;font-size:13px}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.fotos img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--bordo)}
.hidden{display:none !important}
.center{text-align:center}
.install{background:#eff6ff;border:1px dashed #93c5fd;border-radius:12px;padding:12px;font-size:13px;color:#1e3a8a;margin-bottom:14px}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid #cbd5e1;border-top-color:var(--blu);border-radius:50%;animation:s .8s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="top">
  <div class="logo">EUROPA AUTO<small>La mia auto</small></div>
  <button id="btn-esci" class="hidden" onclick="esci()">Esci</button>
</div>

<div class="wrap" id="app"><div class="center" style="padding:40px 0;"><span class="spin"></span></div></div>

<nav class="nav hidden" id="nav">
  <button class="on" data-v="auto" onclick="vai('auto')"><span class="i">🚗</span>La mia auto</button>
  <button data-v="scadenze" onclick="vai('scadenze')"><span class="i">📅</span>Scadenze</button>
  <button data-v="richiedi" onclick="vai('richiedi')"><span class="i">🛠️</span>Richiedi</button>
  <button data-v="richieste" onclick="vai('richieste')"><span class="i">💬</span>Le mie richieste</button>
</nav>

<script>
/* ====================== CONFIG ====================== */
var SB_URL='https://jasrectyddshjizpxiia.supabase.co';
var SB_KEY='sb_publishable_Q2ROk7MEaOCpG2W2xZv_pQ_BDyLItzw';
var AZIENDA={ nome:'Europa Auto S.r.l.', tel:'02 9181820', telHref:'tel:029181820', wa:'39029181820',
  indirizzo:'Via Nigra 4, 20037 Paderno Dugnano (MI)', mail:'vendita@europaautosrl.it' };
var TIPI=[
  {id:'assistenza',   i:'🔧', n:'Assistenza / officina', d:'Spie accese, rumori, qualcosa non va'},
  {id:'tagliando',    i:'🛢️', n:'Tagliando',             d:'Prenota il tagliando o chiedi quando farlo'},
  {id:'carrozzeria',  i:'🌩️', n:'Carrozzeria / grandine', d:'Danni, graffi, grandine: preventivo'},
  {id:'gomme',        i:'🛞', n:'Pneumatici',             d:'Cambio stagionale, usura, foratura'},
  {id:'finanziamento',i:'🏦', n:'Finanziamento / polizza', d:'Rate, estinzione, polizza, documenti'},
  {id:'cambio_auto',  i:'🔁', n:'Voglio cambiare auto',   d:'Valutazione della tua e proposte'},
  {id:'altro',        i:'💬', n:'Altro',                  d:'Qualsiasi altra domanda'}
];
var sb=supabase.createClient(SB_URL, SB_KEY);
var S={ user:null, auto:[], sel:0, scad:{}, richieste:[], vista:'auto', tipo:'', foto:[] };

/* ====================== UTILITA' ====================== */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function dIT(d){ if(!d) return '—'; var x=(d instanceof Date)?d:new Date(d); if(isNaN(x)) return '—'; return x.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function dISO(x){ var d=(x instanceof Date)?x:new Date(x); if(isNaN(d)) return ''; return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseD(v){ if(!v) return null; if(typeof v==='number') return new Date(v); var s=String(v); if(/^\d{13}$/.test(s)) return new Date(+s); var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]); var m2=s.match(/^(\d{2})\/(\d{2})\/(\d{2,4})/); if(m2){ var y=+m2[3]; if(y<100) y+=2000; return new Date(y,+m2[2]-1,+m2[1]); } var t=Date.parse(s); return isNaN(t)?null:new Date(t); }
function addM(d,m){ var x=new Date(d.getTime()); x.setMonth(x.getMonth()+m); return x; }
function giorni(d){ if(!d) return null; var o=new Date(); o.setHours(0,0,0,0); return Math.round((d.getTime()-o.getTime())/86400000); }
function euro(n){ var v=parseFloat(String(n==null?'':n).replace(',','.')); return isNaN(v)?'—':v.toLocaleString('it-IT',{style:'currency',currency:'EUR'}); }
function cap(s){ s=String(s||''); return s? s.charAt(0).toUpperCase()+s.slice(1).toLowerCase():''; }
function nomeAuto(a){ return ((a.marca||'')+' '+(a.modello||'')).replace(/\s+/g,' ').trim(); }
function colore(gg){ if(gg===null) return '#94a3b8'; if(gg<0) return 'var(--ko)'; if(gg<=45) return 'var(--att)'; return 'var(--ok)'; }
function quando(gg){ if(gg===null) return 'data non inserita'; if(gg<0) return 'scaduta da '+Math.abs(gg)+' gg'; if(gg===0) return 'oggi'; if(gg<=60) return 'fra '+gg+' gg'; return 'fra '+Math.round(gg/30)+' mesi'; }

/* ====================== ACCESSO ====================== */
function vistaLogin(msg, modo){
  $('nav').classList.add('hidden'); $('btn-esci').classList.add('hidden');
  modo=modo||'login';
  $('app').innerHTML=
   '<div class="card" style="margin-top:10px;">'
   +'<h1>'+(modo==='login'?'Bentornato':(modo==='reg'?'Crea il tuo accesso':'Recupera la password'))+'</h1>'
   +'<div class="muted">'+(modo==='login'
       ? 'Entra con l’email che hai lasciato in concessionaria: vedrai la tua auto, le scadenze e potrai scriverci.'
       : (modo==='reg' ? 'Usa la stessa email che hai dato in concessionaria al momento dell’acquisto: è così che riconosciamo la tua auto.'
                       : 'Ti mandiamo un link per scegliere una nuova password.'))+'</div>'
   +'<label>Email</label><input id="l-email" type="email" autocomplete="email" inputmode="email" placeholder="nome@esempio.it">'
   +(modo!=='reset'?('<label>Password</label><input id="l-pass" type="password" autocomplete="'+(modo==='reg'?'new-password':'current-password')+'" placeholder="'+(modo==='reg'?'almeno 8 caratteri':'la tua password')+'">'):'')
   +(modo==='reg'?'<label>Il tuo nome</label><input id="l-nome" type="text" autocomplete="name" placeholder="Nome e cognome"><label>Telefono</label><input id="l-tel" type="tel" autocomplete="tel" placeholder="per essere richiamato">':'')
   +'<div id="l-msg"></div>'
   +'<div style="margin-top:16px;"><button class="btn" id="l-go" onclick="'+(modo==='login'?'login()':(modo==='reg'?'registra()':'resetPass()'))+'">'+(modo==='login'?'Entra':(modo==='reg'?'Crea accesso':'Invia link'))+'</button></div>'
   +'<div style="display:flex;justify-content:space-between;margin-top:10px;">'
   +(modo==='login'
      ? '<button class="btn ghost" onclick="vistaLogin(\'\',\'reg\')">Prima volta? Crea accesso</button><button class="btn ghost" onclick="vistaLogin(\'\',\'reset\')">Password dimenticata</button>'
      : '<button class="btn ghost" onclick="vistaLogin()">← Torna all’accesso</button>')
   +'</div></div>'
   +'<div class="card muted center">'+esc(AZIENDA.nome)+' · '+esc(AZIENDA.indirizzo)+'<br><a href="'+AZIENDA.telHref+'">'+esc(AZIENDA.tel)+'</a> · <a href="https://wa.me/'+AZIENDA.wa+'">WhatsApp</a></div>';
  if(msg) $('l-msg').innerHTML='<div class="'+(/errore|non|sbagliat/i.test(msg)?'err':'ok')+'">'+esc(msg)+'</div>';
}
function lmsg(t, ok){ var m=$('l-msg'); if(m) m.innerHTML=t?('<div class="'+(ok?'ok':'err')+'">'+esc(t)+'</div>'):''; }
function attesa(on){ var b=$('l-go'); if(b){ b.disabled=!!on; b.innerHTML=on?'<span class="spin"></span>':b.textContent; } }
async function login(){
  var e=($('l-email').value||'').trim().toLowerCase(), p=$('l-pass').value||'';
  if(!e||!p){ lmsg('Inserisci email e password.'); return; }
  attesa(true);
  var r=await sb.auth.signInWithPassword({ email:e, password:p });
  if(r.error){ attesa(false); lmsg(r.error.message==='Invalid login credentials'?'Email o password sbagliate. Se è la prima volta, crea l’accesso.':('Errore: '+r.error.message)); return; }
  await avvia();
}
async function registra(){
  var e=($('l-email').value||'').trim().toLowerCase(), p=$('l-pass').value||'';
  var nome=($('l-nome').value||'').trim(), tel=($('l-tel').value||'').trim();
  if(!/.+@.+\..+/.test(e)){ lmsg('Email non valida.'); return; }
  if(p.length<8){ lmsg('La password deve avere almeno 8 caratteri.'); return; }
  attesa(true);
  var r=await sb.auth.signUp({ email:e, password:p, options:{ data:{ nome:nome, telefono:tel } } });
  if(r.error){ attesa(false); lmsg('Errore: '+r.error.message); return; }
  if(r.data && r.data.session){ await avvia(); return; }
  attesa(false);
  vistaLogin('Ti abbiamo mandato una mail di conferma: apri il link e poi entra con email e password.');
}
async function resetPass(){
  var e=($('l-email').value||'').trim().toLowerCase();
  if(!/.+@.+\..+/.test(e)){ lmsg('Email non valida.'); return; }
  attesa(true);
  var r=await sb.auth.resetPasswordForEmail(e, { redirectTo: location.origin+location.pathname });
  attesa(false);
  if(r.error){ lmsg('Errore: '+r.error.message); return; }
  vistaLogin('Se l’email è registrata riceverai il link per la nuova password.');
}
async function esci(){ await sb.auth.signOut(); S={ user:null, auto:[], sel:0, scad:{}, richieste:[], vista:'auto', tipo:'', foto:[] }; vistaLogin(); }
async function nuovaPassword(){
  var p=prompt('Scegli la nuova password (almeno 8 caratteri):'); if(!p) return;
  if(p.length<8){ alert('Troppo corta.'); return; }
  var r=await sb.auth.updateUser({ password:p });
  alert(r.error?('Errore: '+r.error.message):'Password aggiornata.');
}

/* ====================== DATI ====================== */
async function carica(){
  var r=await sb.rpc('mie_pratiche');
  if(r.error){ console.warn(r.error); S.auto=[]; S.errore=r.error.message; }
  else { S.auto=(r.data||[]).slice(); S.errore=''; }
  S.auto.sort(function(a,b){ return (+b.consegnatoTs||+b.contrattoTs||0)-(+a.consegnatoTs||+a.contrattoTs||0); });
  var sc=await sb.from('scadenze_cliente').select('*');
  S.scad={}; (sc.data||[]).forEach(function(x){ S.scad[x.cv_id+'|'+x.tipo]=x; });
  var rq=await sb.from('richieste_cliente').select('*').order('created_at',{ascending:false});
  S.richieste=rq.data||[];
}
function autoSel(){ return S.auto[S.sel]||null; }

/* Le scadenze di un'auto: quelle che conosciamo noi + quelle scritte dal cliente */
function scadenze(a){
  var out=[], imm=parseD(a.dataImm), cons=parseD(a.consegnatoTs)||parseD(a.contrattoTs);
  var mia=function(t){ var x=S.scad[a.id+'|'+t]; return x&&x.data?parseD(x.data):null; };
  /* revisione: 4 anni dalla prima immatricolazione, poi ogni 2 */
  var rev=mia('revisione');
  if(!rev && imm){ rev=addM(imm,48); var oggi=new Date(); while(rev<oggi) rev=addM(rev,24); }
  out.push({ tipo:'revisione', nome:'Revisione', fonte:(mia('revisione')?'inserita da te':'calcolata dalla 1ª immatricolazione'), data:rev, mod:true });
  /* garanzia */
  var gm=parseInt(a.garanziaMesi,10);
  if(cons && gm) out.push({ tipo:'garanzia', nome:'Garanzia', fonte:gm+' mesi dalla consegna', data:addM(cons,gm) });
  /* polizza furto/incendio del contratto */
  var am=parseInt(a.assicMesi,10);
  if((a.assicOn===true||a.assicOn==='true') && cons && am) out.push({ tipo:'polizza', nome:'Polizza '+(a.polizzaTipo&&a.polizzaTipo!=='nessuna'?cap(String(a.polizzaTipo).replace('_',' ')):'furto/incendio'), fonte:am+' mesi dalla consegna', data:addM(cons,am) });
  /* finanziamento */
  var fd=a.finDelibera, fp=a.finPagamento;
  var durata=parseInt((fd&&fd.durata)||(fp&&fp.rate)||'',10);
  var rata=(fd&&fd.rata)||(fp&&fp.importoRata)||'';
  if(cons && durata) out.push({ tipo:'finanziamento', nome:'Ultima rata '+((fd&&fd.finanziaria)?fd.finanziaria:'finanziamento'), fonte:durata+' rate'+(rata?(' da '+euro(rata)):''), data:addM(cons,durata) });
  /* RC auto, bollo, tagliando: li scrive il cliente */
  out.push({ tipo:'rc', nome:'RC Auto', fonte:'scadenza della tua assicurazione', data:mia('rc'), mod:true });
  out.push({ tipo:'bollo', nome:'Bollo', fonte:'scadenza del bollo', data:mia('bollo'), mod:true });
  var tg=mia('tagliando');
  if(!tg && cons) tg=addM(cons,12);
  out.push({ tipo:'tagliando', nome:'Prossimo tagliando', fonte:(mia('tagliando')?'inserito da te':'consigliato: 12 mesi dalla consegna'), data:tg, mod:true });
  out.forEach(function(s){ s.gg=giorni(s.data); });
  out.sort(function(x,y){ var a=(x.gg===null)?99999:x.gg, b=(y.gg===null)?99999:y.gg; return a-b; });
  return out;
}
async function salvaScadenza(tipo){
  var a=autoSel(); if(!a) return;
  var attuale=S.scad[a.id+'|'+tipo];
  var v=prompt('Data di scadenza (gg/mm/aaaa). Lascia vuoto per cancellarla.', attuale&&attuale.data?dIT(attuale.data):'');
  if(v===null) return;
  v=v.trim();
  if(!v){ if(attuale){ await sb.from('scadenze_cliente').delete().eq('id',attuale.id); } }
  else {
    var d=parseD(v); if(!d){ alert('Data non valida: usa il formato gg/mm/aaaa.'); return; }
    var r=await sb.from('scadenze_cliente').upsert({ user_id:S.user.id, cv_id:a.id, tipo:tipo, data:dISO(d), updated_at:new Date().toISOString() }, { onConflict:'user_id,cv_id,tipo' });
    if(r.error){ alert('Non salvata: '+r.error.message); return; }
  }
  await carica(); render();
}

/* ====================== VISTE ====================== */
function vai(v){ S.vista=v; render(); window.scrollTo(0,0); }
function render(){
  $('nav').classList.remove('hidden'); $('btn-esci').classList.remove('hidden');
  document.querySelectorAll('.nav button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-v')===S.vista); });
  var h='';
  if(S.errore) h+='<div class="err">Non riesco a leggere i dati: '+esc(S.errore)+'</div>';
  if(!S.auto.length){
    h+='<div class="card"><h1>Nessuna auto collegata</h1><div class="muted">Non troviamo acquisti registrati con <b>'+esc(S.user.email)+'</b>. Se hai comprato da noi con un’altra email, scrivici e colleghiamo la tua auto a questo accesso.</div>'
      +'<div style="margin-top:14px;"><a class="btn" href="https://wa.me/'+AZIENDA.wa+'?text='+encodeURIComponent('Buongiorno, vorrei collegare la mia auto all’app. La mia email è '+S.user.email)+'">💬 Scrivici su WhatsApp</a></div></div>';
    if(S.vista!=='richiedi' && S.vista!=='richieste'){ $('app').innerHTML=h+installHint(); return; }
  }
  if(S.vista==='auto') h+=vAuto();
  else if(S.vista==='scadenze') h+=vScadenze();
  else if(S.vista==='richiedi') h+=vRichiedi();
  else h+=vRichieste();
  $('app').innerHTML=installHint()+h;
}
function selettore(){
  if(S.auto.length<2) return '';
  return '<select onchange="S.sel=+this.value;render()" style="margin-bottom:12px;">'+S.auto.map(function(a,i){ return '<option value="'+i+'"'+(i===S.sel?' selected':'')+'>'+esc(nomeAuto(a))+(a.targa?(' · '+a.targa):'')+'</option>'; }).join('')+'</select>';
}
function vAuto(){
  var a=autoSel(); if(!a) return '';
  var sc=scadenze(a), urgenti=sc.filter(function(s){ return s.gg!==null && s.gg<=45; });
  var fd=a.finDelibera, fp=a.finPagamento;
  var h=selettore();
  h+='<div class="card"><div class="hero">'+(a.foto?('<img src="'+esc(a.foto)+'" alt="">'):'<div class="ph">🚗</div>')
    +'<div><h1 style="font-size:19px;">'+esc(nomeAuto(a))+'</h1><div class="muted">'+esc(a.allestimento||'')+'</div>'+(a.targa?('<div class="targa">'+esc(a.targa)+'</div>'):'')+'</div></div>'
    +'<div class="grid2" style="margin-top:14px;">'
    +kv('Consegnata il', dIT(parseD(a.consegnatoTs)||parseD(a.contrattoTs)))
    +kv('1ª immatricolazione', dIT(parseD(a.dataImm)))
    +kv('Km alla consegna', a.km?(parseInt(a.km,10).toLocaleString('it-IT')+' km'):'—')
    +kv('Colore', cap(a.colore)||'—')
    +(a.telaio?kv('Telaio', a.telaio):'')
    +(a.alimentazione?kv('Alimentazione', cap(a.alimentazione)):'')
    +'</div></div>';
  if(urgenti.length){
    h+='<div class="card" style="border-color:#fed7aa;background:#fffbeb;"><h2>⚠️ Da tenere d’occhio</h2>'
      +urgenti.map(function(s){ return '<div class="sc"><span class="dot" style="background:'+colore(s.gg)+'"></span><div class="t"><b>'+esc(s.nome)+'</b><span>'+esc(quando(s.gg))+'</span></div><div class="d">'+dIT(s.data)+'</div></div>'; }).join('')
      +'<div style="margin-top:10px;"><button class="btn sec" onclick="vai(\'scadenze\')">Tutte le scadenze</button></div></div>';
  }
  if(fd||fp){
    h+='<div class="card"><h2>🏦 Finanziamento</h2><div class="grid2">'
      +kv('Finanziaria', (fd&&fd.finanziaria)||'—')
      +kv('Rate', ((fd&&fd.durata)||(fp&&fp.rate)||'—'))
      +kv('Rata', euro((fd&&fd.rata)||(fp&&fp.importoRata)))
      +kv('Ultima rata', (function(){ var s=sc.filter(function(x){ return x.tipo==='finanziamento'; })[0]; return s?dIT(s.data):'—'; })())
      +'</div><div class="muted" style="margin-top:8px;">Per estinzione anticipata, conteggi o documenti scrivici dalla sezione Richiedi → Finanziamento.</div></div>';
  }
  h+='<div class="card"><h2>Hai bisogno di noi?</h2><div class="muted">Assistenza, tagliando, carrozzeria, gomme: mandaci la richiesta dall’app, ti rispondiamo qui e al telefono.</div>'
    +'<div style="margin-top:12px;"><button class="btn" onclick="vai(\'richiedi\')">🛠️ Fai una richiesta</button></div>'
    +'<div style="margin-top:8px;"><a class="btn sec" href="'+AZIENDA.telHref+'">📞 Chiama '+esc(AZIENDA.tel)+'</a></div></div>';
  return h;
}
function kv(k,v){ return '<div class="kv"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>'; }
function vScadenze(){
  var a=autoSel(); if(!a) return '';
  var sc=scadenze(a);
  var h=selettore()+'<div class="card"><h1 style="font-size:19px;">Scadenze</h1><div class="muted">Le date con ✎ le puoi inserire o correggere tu: ti avvisiamo noi quando si avvicinano.</div></div><div class="card">';
  h+=sc.map(function(s){
    return '<div class="sc"><span class="dot" style="background:'+colore(s.gg)+'"></span><div class="t"><b>'+esc(s.nome)+'</b><span>'+esc(s.fonte)+(s.gg!==null?(' · '+quando(s.gg)):'')+'</span></div>'
      +'<div class="d">'+(s.data?dIT(s.data):'<small>da inserire</small>')+'</div>'
      +(s.mod?('<button onclick="salvaScadenza(\''+s.tipo+'\')">✎</button>'):'')+'</div>';
  }).join('');
  h+='</div><div class="card muted">Revisione: la prima a 4 anni dall’immatricolazione, poi ogni 2. Se l’hai già fatta, correggi la data con ✎. Vuoi che la prenotiamo noi? <a href="#" onclick="S.tipo=\'assistenza\';vai(\'richiedi\');return false;">Chiedicelo</a>.</div>';
  return h;
}
function vRichiedi(){
  var a=autoSel();
  var h='<div class="card"><h1 style="font-size:19px;">Di cosa hai bisogno?</h1>'+(a?('<div class="muted">Per '+esc(nomeAuto(a))+(a.targa?(' · '+a.targa):'')+'</div>'):'')+'</div>';
  h+='<div class="tipi">'+TIPI.map(function(t){ return '<button class="tipo'+(S.tipo===t.id?' on':'')+'" onclick="S.tipo=\''+t.id+'\';render();setTimeout(function(){var e=document.getElementById(\'r-form\');if(e)e.scrollIntoView({behavior:\'smooth\'});},50)"><span class="i">'+t.i+'</span><b>'+esc(t.n)+'</b><span>'+esc(t.d)+'</span></button>'; }).join('')+'</div>';
  if(S.tipo){
    var t=TIPI.filter(function(x){ return x.id===S.tipo; })[0];
    h+='<div class="card" id="r-form" style="margin-top:14px;"><h2>'+t.i+' '+esc(t.n)+'</h2>'
      +(S.auto.length>1?('<label>Auto</label>'+selettore().replace('style="margin-bottom:12px;"','')):'')
      +'<label>Raccontaci</label><textarea id="r-testo" placeholder="'+esc(S.tipo==='carrozzeria'?'Dove sono i danni, quando è successo, se hai già aperto il sinistro con la tua assicurazione…':(S.tipo==='tagliando'?'Km attuali e giorni in cui puoi portarla…':'Scrivi qui…'))+'"></textarea>'
      +'<label>Giorno preferito (facoltativo)</label><input id="r-data" type="date" min="'+dISO(new Date())+'">'
      +'<label>Telefono per richiamarti</label><input id="r-tel" type="tel" inputmode="tel" value="'+esc((S.user.user_metadata&&S.user.user_metadata.telefono)||'')+'" placeholder="+39 …">'
      +(S.tipo==='carrozzeria'||S.tipo==='assistenza'||S.tipo==='gomme'?('<label>Foto (fino a 3)</label><input id="r-foto" type="file" accept="image/*" multiple onchange="fotoScelte(this)"><div class="fotos" id="r-fotos">'+S.foto.map(function(f){ return '<img src="'+f+'">'; }).join('')+'</div>'):'')
      +'<div id="r-msg"></div>'
      +'<div style="margin-top:14px;"><button class="btn" id="r-go" onclick="invia()">Invia la richiesta</button></div>'
      +'<div class="muted center" style="margin-top:10px;">Ti rispondiamo in app e al telefono negli orari di apertura.</div></div>';
  }
  return h;
}
function fotoScelte(inp){
  var files=Array.prototype.slice.call(inp.files||[]).slice(0,3); S.foto=[];
  files.forEach(function(f){
    var img=new Image(), url=URL.createObjectURL(f);
    img.onload=function(){
      var max=1280, w=img.width, hh=img.height, k=Math.min(1,max/Math.max(w,hh));
      var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(hh*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      S.foto.push(c.toDataURL('image/jpeg',0.72)); URL.revokeObjectURL(url);
      var box=$('r-fotos'); if(box) box.innerHTML=S.foto.map(function(x){ return '<img src="'+x+'">'; }).join('');
    };
    img.src=url;
  });
}
async function invia(){
  var a=autoSel(), testo=($('r-testo').value||'').trim(), data=$('r-data').value||null, tel=($('r-tel').value||'').trim();
  var m=$('r-msg'), b=$('r-go');
  if(!testo && S.tipo!=='tagliando'){ m.innerHTML='<div class="err">Scrivi due righe, così sappiamo come aiutarti.</div>'; return; }
  b.disabled=true; b.innerHTML='<span class="spin"></span>';
  var rec={ user_id:S.user.id, email:S.user.email, nome:(S.user.user_metadata&&S.user.user_metadata.nome)||'', telefono:tel,
    cv_id:a?a.id:null, targa:a?a.targa:null, auto:a?nomeAuto(a):null, tipo:S.tipo, testo:testo, data_pref:data, foto:S.foto };
  var r=await sb.from('richieste_cliente').insert(rec);
  if(r.error){ b.disabled=false; b.textContent='Invia la richiesta'; m.innerHTML='<div class="err">Non inviata: '+esc(r.error.message)+'</div>'; return; }
  S.foto=[]; S.tipo='';
  await carica(); vai('richieste');
  var ok=document.createElement('div'); ok.className='ok'; ok.textContent='✓ Richiesta inviata. Ti rispondiamo al più presto.';
  $('app').insertBefore(ok, $('app').firstChild);
}
function vRichieste(){
  var h='<div class="card"><h1 style="font-size:19px;">Le mie richieste</h1><div class="muted">Qui vedi lo stato e le nostre risposte.</div></div>';
  if(!S.richieste.length) return h+'<div class="card muted center">Nessuna richiesta ancora. <a href="#" onclick="vai(\'richiedi\');return false;">Fanne una</a>.</div>';
  h+='<div class="card">'+S.richieste.map(function(r){
    var t=TIPI.filter(function(x){ return x.id===r.tipo; })[0]||{i:'💬',n:r.tipo};
    var st={ricevuta:['p-ric','Ricevuta'],in_lavorazione:['p-lav','In lavorazione'],chiusa:['p-chi','Chiusa']}[r.stato]||['p-ric',r.stato];
    return '<div class="req"><div class="h"><b>'+t.i+' '+esc(t.n)+'</b><span class="pill '+st[0]+'">'+st[1]+'</span></div>'
      +'<div class="muted">'+dIT(r.created_at)+(r.auto?(' · '+esc(r.auto)):'')+(r.data_pref?(' · preferito: '+dIT(r.data_pref)):'')+'</div>'
      +(r.testo?('<div class="m">'+esc(r.testo)+'</div>'):'')
      +((r.foto&&r.foto.length)?('<div class="fotos">'+r.foto.map(function(f){ return '<img src="'+f+'">'; }).join('')+'</div>'):'')
      +(r.risposta?('<div class="r"><b>Europa Auto'+(r.gestita_da?(' · '+esc(r.gestita_da)):'')+':</b> '+esc(r.risposta)+(r.risposta_ts?('<div class="muted">'+dIT(r.risposta_ts)+'</div>'):'')+'</div>'):'')
      +(r.stato==='ricevuta'?('<div style="margin-top:6px;"><button class="btn ghost" style="padding:0;width:auto;" onclick="annulla(\''+r.id+'\')">Annulla richiesta</button></div>'):'')
      +'</div>';
  }).join('')+'</div>';
  return h;
}
async function annulla(id){ if(!confirm('Annullare questa richiesta?')) return; await sb.from('richieste_cliente').delete().eq('id',id); await carica(); render(); }

/* ====================== PWA ====================== */
var _installEv=null;
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); _installEv=e; try{ render(); }catch(_){ } });
function installHint(){
  if(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) return '';
  if(_installEv) return '<div class="install">📲 Aggiungi l’app alla schermata Home per averla sempre a portata di mano. <a href="#" onclick="_installEv.prompt();return false;"><b>Installa</b></a></div>';
  if(/iphone|ipad/i.test(navigator.userAgent)) return '<div class="install">📲 Su iPhone: tocca <b>Condividi</b> → <b>Aggiungi alla schermata Home</b> per installare l’app.</div>';
  return '';
}
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }

/* ====================== AVVIO ====================== */
async function avvia(){
  var s=await sb.auth.getSession();
  S.user=(s.data&&s.data.session)?s.data.session.user:null;
  if(!S.user){ vistaLogin(); return; }
  $('app').innerHTML='<div class="center" style="padding:40px 0;"><span class="spin"></span></div>';
  await carica();
  render();
}
sb.auth.onAuthStateChange(function(ev){ if(ev==='PASSWORD_RECOVERY'){ nuovaPassword(); } });
avvia();
</script>
