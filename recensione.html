<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lascia una recensione · Europa Auto</title>
<meta name="robots" content="noindex">
<!-- Pagina "ponte" per il pulsante RECENSIONE GOOGLE del modello WhatsApp.
     1) Meta non accetta i link brevi di Google (g.page): il pulsante usa
        questo indirizzo del nostro dominio.
     2) Il pulsante di WhatsApp apre il link nel browser INTERNO di WhatsApp,
        dove il cliente non e' collegato a Google: Google chiede di accedere
        anche se sul telefono e' gia' dentro. Qui, se la pagina e' aperta
        dentro WhatsApp (o Facebook/Instagram), su Android si passa subito a
        Chrome / all'app Google Maps, dove l'account c'e' gia'. Se non
        riesce, restano i pulsanti e la spiegazione. -->
<style>
:root{--blu:#1a4fa0;--testo:#0f172a;--grigio:#64748b;--sfondo:#f8fafc;--bordo:#cbd5e1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--sfondo);color:var(--testo);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
.c{max-width:420px;width:100%;text-align:center}
h1{font-size:22px;margin:0 0 8px}
p{color:var(--grigio);font-size:15px;line-height:1.5;margin:0 0 16px}
.btn{display:block;width:100%;text-decoration:none;font-weight:700;padding:14px 18px;border-radius:12px;font-size:16px;margin:0 0 10px;border:0;font-family:inherit;cursor:pointer}
.pri{background:var(--blu);color:#fff}
.sec{background:#fff;color:var(--testo);border:1px solid var(--bordo)}
.btn:focus-visible{outline:3px solid #60a5fa;outline-offset:3px}
.nota{font-size:13.5px;color:var(--grigio);background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px;text-align:left;line-height:1.5;margin-top:6px}
.nascosto{display:none}
</style>
</head>
<body>
<div class="c">
  <h1>Grazie per la sua recensione!</h1>
  <p id="msg">La stiamo portando alla pagina di Google per lasciare la sua opinione su Europa Auto.</p>
  <a id="b-chrome" class="btn pri nascosto" href="#">Apri in Chrome</a>
  <a id="b-maps" class="btn sec nascosto" href="#">Apri con l'app Google Maps</a>
  <a id="b-diretto" class="btn sec" href="https://g.page/r/CfP6etGmdA-yEBM/review">Apri qui (serve accedere a Google)</a>
  <div id="nota" class="nota nascosto"></div>
</div>
<script>
(function(){
  var LINK='https://g.page/r/CfP6etGmdA-yEBM/review';
  var senzaHttps=LINK.replace(/^https?:\/\//,'');
  var ua=navigator.userAgent||'';
  var android=/Android/i.test(ua), ios=/iPhone|iPad|iPod/i.test(ua);
  /* browser interno di un'app (WhatsApp, Facebook, Instagram, Messenger) */
  var interno=/WhatsApp|FBAN|FBAV|FB_IAB|Instagram|Messenger|; wv\)/i.test(ua);
  var $=function(id){ return document.getElementById(id); };

  if(!interno){ location.replace(LINK); return; }

  if(android){
    /* Chrome (dove di solito si e' gia' dentro con Google) e, in alternativa,
       l'app Google Maps; se nessuna delle due c'e' si torna al link normale */
    /* niente "ripiego" automatico sul link normale: dentro WhatsApp
       riporterebbe alla pagina di accesso di Google. Se il salto non riesce
       si resta qui, con i pulsanti e la spiegazione. */
    var chrome='intent://'+senzaHttps+'#Intent;scheme=https;package=com.android.chrome;end';
    var maps='intent://'+senzaHttps+'#Intent;scheme=https;package=com.google.android.apps.maps;end';
    $('b-chrome').href=chrome; $('b-chrome').classList.remove('nascosto');
    $('b-maps').href=maps; $('b-maps').classList.remove('nascosto');
    $('msg').textContent='Per lasciare la recensione serve il suo account Google: la apriamo fuori da WhatsApp, dove di solito è già collegato.';
    $('nota').innerHTML='Se si apre ancora la pagina di accesso: tocchi i <b>tre puntini ⋮</b> in alto a destra e scelga <b>“Apri in Chrome”</b> (o “Apri nel browser”).';
    $('nota').classList.remove('nascosto');
    setTimeout(function(){ location.href=chrome; }, 250);
  } else if(ios){
    $('msg').textContent='Per lasciare la recensione serve il suo account Google.';
    $('nota').innerHTML='Se Google le chiede di accedere: tocchi l’icona <b>↗ / Safari</b> in basso (o i <b>tre puntini</b>) e scelga <b>“Apri in Safari”</b>, dove di solito è già collegato. Poi tocchi di nuovo “Apri la pagina della recensione”.';
    $('nota').classList.remove('nascosto');
  } else {
    location.replace(LINK);
  }
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://g.page/r/CfP6etGmdA-yEBM/review"></noscript>
</body>
</html>
